syntax = "proto3";

package checkout.fraud.v1;

// FraudCheck is the public RPC contract for risk decisions during checkout.
service FraudCheck {
  rpc Assess(FraudAssessmentRequest) returns (FraudAssessmentDecision);
}

message FraudAssessmentRequest {
  string order_id = 1;
  string account_id = 2;
  int64 amount_minor = 3;
}

message FraudAssessmentDecision {
  enum Disposition {
    DISPOSITION_UNSPECIFIED = 0;
    DISPOSITION_ALLOW = 1;
    DISPOSITION_REVIEW = 2;
    DISPOSITION_DENY = 3;
  }

  Disposition disposition = 1;
  string reason = 2;
}
