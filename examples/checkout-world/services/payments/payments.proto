syntax = "proto3";

package checkout.payments.v1;

// Payments is an external dependency of FraudCheck in the demo architecture.
service Payments {
  rpc Authorize(PaymentAuthorizationRequest) returns (PaymentAuthorizationDecision);
}

message PaymentAuthorizationRequest {
  string order_id = 1;
  int64 amount_minor = 2;
}

message PaymentAuthorizationDecision {
  bool authorized = 1;
  string authorization_id = 2;
}
