# Nix CI skeleton.
#
# The preamble (checkout + Install Nix + Cache Nix store) is the canonical
# shared block; everything after the marker is repo-specific by design.
# Copy this file to .github/workflows/ci.yml and replace the TODO steps.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pulls from the public devenv cache; skipPush keeps this auth-free
      # (no CACHIX_AUTH_TOKEN secret needed, nothing is uploaded).
      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        with:
          name: devenv
          skipPush: true

      # --- end of shared preamble; steps below are repo-specific ---

      - name: Install JavaScript dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Build
        run: nix develop --command bazel build //...

      - name: Test
        env:
          SWARM_ELECTRON_NO_SANDBOX: "1"
        run: nix develop --command bazel test //... --test_tag_filters=-desktop --test_output=errors

      - name: Virtual desktop smoke
        env:
          DISPLAY: ":0"
          XAUTHORITY: /tmp/hostile-ambient-xauthority
          SWARM_SOURCE_WORKSPACE: ${{ github.workspace }}
          SWARM_VIRTUAL_DESKTOP_PORT: "55174"
          # GitHub's Nix store cannot provide a root-owned setuid
          # chrome-sandbox. Electron's renderer API restrictions and context
          # isolation remain configured, but Chromium's OS sandbox is off.
          SWARM_ELECTRON_NO_SANDBOX: "1"
        run: nix develop --command bazel test //tools:virtual-desktop-smoke-test //tools:virtual-desktop-agent-test --jobs=3 --test_output=streamed --nocache_test_results

      - name: Unpack virtual desktop evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/virtual-desktop-evidence"
          mkdir -p "$evidence"
          archive="$(find bazel-testlogs/tools/virtual-desktop-smoke-test/test.outputs -name outputs.zip -print -quit 2>/dev/null || true)"
          if [[ -n "$archive" ]]; then
            unzip -q "$archive" -d "$evidence"
          else
            printf 'No undeclared-output archive was produced. Inspect the job log.\n' >"$evidence/README.txt"
          fi

      - name: Upload virtual desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-desktop-evidence
          path: ${{ runner.temp }}/virtual-desktop-evidence/**
          if-no-files-found: warn

      - name: Unpack agent journey evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/agent-journey-evidence"
          mkdir -p "$evidence"
          archive="$(find bazel-testlogs/tools/virtual-desktop-agent-test/test.outputs -name outputs.zip -print -quit 2>/dev/null || true)"
          if [[ -n "$archive" ]]; then
            unzip -q "$archive" -d "$evidence"
          else
            printf 'No agent journey archive was produced. Inspect the job log.\n' >"$evidence/README.txt"
          fi

      - name: Upload agent journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-journey-evidence
          path: ${{ runner.temp }}/agent-journey-evidence/**
          if-no-files-found: warn
