id: ui-live-build-links
title: Replace UI-sprint captured Bazel links with a workspace-scoped live provider
desc: The UI sprint currently overlays an explicitly dated local Bazel query capture,
  scoped to the captured registered repository id. Replace it with a typed local-core
  provider for general workspaces, preserving source/target separation, bounded graph
  slices, provenance and working/built staleness. Do not treat the captured snapshot
  or mock sprites as fresh observed build/runtime evidence.
