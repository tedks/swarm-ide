id: ui-live-build-links
title: Replace captured Bazel links with live data for each workspace
desc: The UI sprint currently overlays a local Bazel query capture with an explicit
  date, limited to the captured registered repository id. Replace it with a typed
  local-core provider for general workspaces. Keep sources and targets separate, limit
  graph-slice size, record where the data came from and show whether working/built
  data is stale. Do not treat the captured snapshot or mock sprites as fresh observations
  of builds or runtime behavior.
