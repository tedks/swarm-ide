id: agent-run-runtime
title: Implement Codex run control, saved state and reliable process cleanup
desc: 'R1/R2/R3: implement the app-server stdio adapter and version checks; durable
  launch and steering request identities; one active run; accurate cancel, finished
  and unknown states; limits on saved data and output; crash-safe cleanup of processes
  the runtime owns; and uncertain outcomes during local-core failures. Runtime leads
  integration. See the first-agent-run-wave plan.'
