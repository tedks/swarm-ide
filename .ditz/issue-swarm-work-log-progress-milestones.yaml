id: swarm-work-log-progress-milestones
title: Show Work Log milestones during long-running agent work
desc: 'Goals live use showed empty Work Log during substantial ongoing agent work:
  current reader waits for task_complete and excludes completed turns older than 30
  minutes. Recent final-answer item was followed by turn_aborted, so do not treat
  final text alone as completion. Add useful summaries of concrete observed milestones
  during long turns, with novelty/debounce/cost controls and clear distinction between
  work accomplished and task completion. Preserve raw Activity and real completion/abortion
  semantics; no fabrication, automatic user-agent message or unbounded historical
  backfill. Default summarizer remains configurable Codex/Luna.'
type: feature
component: default
