id: swarm-native-graph-locations
title: Expose structured native-run source locations to graph overlays
desc: Registered agent sprites are implemented from existing typed path events. Native
  TrustedSnapshot.activities currently strips paths into generic summaries. A follow-up
  should carry core-validated path observations (not parse prose/task attachments)
  with exact per-run worktree and history semantics, then reuse the graph overlay.
