id: virtual-supervisor-fixed-port-collision
title: Isolate virtual-supervisor test ports from unrelated listeners
desc: The W2B local full suite at 8e46921 found loopback port 58014 occupied during
  stale-member-pid. This caused a diagnostic mismatch before the scenario ran; no
  user process was touched. tests/virtual-desktop-supervisor uses fixed ports numbered
  58000 + case. Allocate isolated sockets owned by the test, or explicitly skip/retry
  on collisions without masking actual harness failures. This is outside the renderer
  work assigned to W2B. The shared virtual.lock does not reserve unrelated external
  ports.
type: bugfix
component: default
