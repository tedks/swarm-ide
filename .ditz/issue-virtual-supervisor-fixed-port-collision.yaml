id: virtual-supervisor-fixed-port-collision
title: Isolate virtual-supervisor test ports from unrelated listeners
desc: W2B local full suite at8e46921 hit loopback58014 occupied during stale-member-pid,
  causing diagnostic mismatch before scenario; no user process touched. tests/virtual-desktop-supervisor
  uses fixed58000+case numbering. Use independently owned/isolated socket allocation
  or explicit collision skip/retry without masking actual harness failures. Outside
  renderer W2B ownership; shared virtual.lock does not reserve unrelated external
  ports.
type: bugfix
component: default
