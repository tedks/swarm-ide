id: swarm-project-agent-sprites
title: Show project-wide agent sprites with focused worktree views
desc: Show agent overlays across graph surfaces. On primary master/main worktree include
  agents from all confirmed same-project worktrees with origin labels; on a feature
  worktree include only that worktree. Use meaningful file/component/build/service/task
