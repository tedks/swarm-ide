id: task-graph-compact-fit-followon
title: Compact task graphs may need a manual Fit in short panes
desc: 'T4 packaged screenshot03 shows readable vertical task cards, but an outer card
  can be partly clipped in the short graph area after the attachment dock grows. Fit
  and pan are already available. Follow up on when explicit scope fitting runs and
  how it adapts to size changes, without causing camera jumps. This is noncritical:
  it does not affect task, source or draft correctness and does not block the demo.'
