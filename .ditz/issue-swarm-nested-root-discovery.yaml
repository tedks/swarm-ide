id: swarm-nested-root-discovery
title: Recognize root CLI sessions with nested native helpers
desc: Root is omitted by automatic tmux discovery when its open transcripts include
  grandchildren. Installed86e557a5 discover(pane) returns undefined, but exact known
  rollout succeeds; metadata finds one cli root and five non-direct helper sources.
  Support verified nested-helper lineage without choosing unrelated CLI sessions or
  manufacturing parentage. Reuse checked registry/handoff APIs. Coordinate with swarm-live-discovery-worktree-count
  so later refresh can recover.
