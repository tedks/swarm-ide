id: service-topology-world-parameter
title: Parameterize service topology worlds when multiple worlds are supported
desc: The Google reviewer raised this minor follow-up in the Q1 council review. The
  adapter and graph focuses intentionally support only world:working today. Adding
  a general world parameter must update the graph, mappings and context together;
  relabeling context alone is not enough. This is deferred beyond Q1, whose limited
  scope requires an exact match to the current world.
