id: ui-artifact-tiling
title: Tile artifact text panes with independent tab groups
desc: The UI sprint delivered one independent source/task tab area that closes when
  empty. The user also requested VS Code-style multiple tiled text views, independent
  tab groups and, eventually, drag arrangement. Preserve unsaved buffers, cursor position,
  typed artifact focus, graph coordination and Context when implementing this. Do
  not describe the existing single-pane tabs as tiling.
