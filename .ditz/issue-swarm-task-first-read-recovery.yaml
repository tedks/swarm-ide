id: swarm-task-first-read-recovery
title: Recover automatically after the first task-list read fails
desc: 'Re-audit at 6eb9af05: TaskBridgeClient now adopts a newly available/different
  metadata ref even without a prior snapshot (client.ts:270-276; direct test near
  task-client.test.ts:88). The blanket statement that initial failures always require
  manual Refresh is obsolete. Remaining scope: decide and implement one bounded automatic
  recovery for a failed scan when no new available ref is observed, without a general
  retry scheduler. Current tests deliberately avoid repeating an initial failed scan
  without an available ref (task-client.test.ts:385-397). Fresh Nix/Bazel targeted
  run passed all 69 task-client tests. Preserve changed-ref adoption and bounded scanning;
  do not claim a historical operator startup cause.'
type: bugfix
