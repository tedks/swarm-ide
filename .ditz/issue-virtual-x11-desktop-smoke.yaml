id: virtual-x11-desktop-smoke
title: Run desktop verification in an isolated virtual X11 display
desc: Run the existing exact-window desktop smoke in an isolated virtual X11 server
  (for example Xvfb with a minimal window manager), wire it into a reproducible Bazel/CI
  entrypoint, and ensure screenshots cannot observe the developer desktop.
