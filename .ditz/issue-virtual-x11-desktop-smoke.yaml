  comment: 'Executive gate: all automated UI verification must run on an owned virtual
    X11 display, never the ambient developer DISPLAY. The runner must fail closed
    on display setup/ownership errors, target the exact marked application window,
    preserve screenshots/logs as test artifacts, and support local and CI Bazel entrypoints.'
