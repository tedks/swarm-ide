id: agent-reload-recovery-copy
title: Clarify agent reload notices and avoid controls that do nothing
desc: Follow up on nonblocking Anthropic W2B review comments at 63def45. Clearing
  text can do nothing when only unresolved receipts remain, and the discard warning
  is too broad. A stale clear action can report newer work even after the draft was
  closed or emptied. An old read notice can replace a newer pending-read notice. The
  loading screen does not show the refresh-blocking notice; work-rail copy assumes
  one location; and all read failures look like missing data, including transport
  and storage errors. Improve these messages alongside renderer-reload-notice-reasons.
  Keep the tested safety conditions, no-replay behavior, status handling and explicit
  discard action unchanged; do not add lifecycle or source-persistence work. After
  a dropped snapshot, selected details intentionally remain stale until Refresh agent
  state or a new event; discard still works.
