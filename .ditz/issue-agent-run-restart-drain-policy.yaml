id: agent-run-restart-drain-policy
title: Decide whether core restart should wait briefly for agent acknowledgements
desc: Anthropic R0 review note for a ROOT/R2 decision; it does not block R1/W1/E1
  fixture work. An intentional core replacement currently marks in-flight agent writes
  as unknown immediately, while file.write gets time to finish. Consider giving agent
  requests their existing acknowledgement deadline before replacement. Preserve no-replay
  behavior, native-window stability and cleanup of owned processes. Do not change
  this policy implicitly in R0.
