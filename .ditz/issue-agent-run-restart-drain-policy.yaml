  comment: 'User delegated this decision to ROOT for overnight execution. RESOLVED:
    intentional core replacement closes admission and waits at most 1000ms for pending
    mutation acknowledgements (or earlier existing deadline), then persists/surfaces
    unresolved outcomes as unknown and proceeds with owned shutdown. Never wait for
    whole agent tasks or replay commands; actual crashes get no grace. Preserve file-write/dirty-buffer
    protections and native-window identity. Runtime R2 implements/tests and records
    this in ExecPlan.'
