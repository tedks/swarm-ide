id: editor-codemirror-state-identity
title: Use one CodeMirror state package for correct keyboard selection
desc: T3's packaged-app test using native ArrowRight logged TextLeaf.lineInner undefined.length.
  commands6.10.3 uses state6.7.4, while app/view use6.5.4. An EditorSelection from
  the other copy fails instanceof in6.5.4 resolveTransactionInner; the nonexistent
  top-level anchor/head produces an undefined selection. Use one compatible, pinned
  state package instance. Add a regression test that runs the actual command, and
  verify it without errors in a virtual desktop. A dependency exception was requested
  from ROOT; no dependency change had been made at the time of this report.
