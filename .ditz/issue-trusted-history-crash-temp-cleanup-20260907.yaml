id: trusted-history-crash-temp-cleanup-20260907
title: Clean up trusted history temporary files left by abrupt process termination
desc: FileTrustedLocalStore writes through a private temporary file, renames it atomically,
  and removes its current temporary file on ordinary failure. If the process dies
  between creation and rename, an owned .history.json.UUID.tmp snapshot can remain
  across restarts. The current 8 MiB limit covers the canonical snapshot, not accumulated
  crash leftovers. The native F1 store review found no Critical or Important issue
  under the assumption that trusted-local history has one owner. Add a small startup
  cleanup with limits on its work and restricted to files owned by the store. Preserve
  unrelated files and canonical history, and cover crash recovery in tests.
