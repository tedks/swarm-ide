id: swarm-component-layout-drag
title: Give component contracts more space and allow individual node dragging
desc: Preserve the current component graph structure and authored links. Increase
  default spacing so contracts are legible, make node dragging move only that node
  while background drag pans, retain user-adjusted positions within the current workspace/component
  view across ordinary refresh/navigation, and provide a scoped reset. Component graph
  only; no graph ontology, architecture inference, or task/service/build behavior
  changes. Dedicated implementation fork; ROOT review/landing/adoption.
