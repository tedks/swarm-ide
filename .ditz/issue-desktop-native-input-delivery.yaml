id: desktop-native-input-delivery
title: Distinguish high-rate synthetic keyboard loss from product input handling
desc: N2 full desktop validation observed actual FILE_NOT_FOUND after 1-2ms native
  xdotool input lost one character (fraudchek.ts or fraudcheck.s). Exact palette-mode
  transition waits plus 10ms human-paced input retain all assertions and are the bounded
  harness mitigation. Cause is not proven to be X11 delivery versus controlled-input
  handling; investigate with an instrumented disposable-owned window if this operational
  stress case matters. Do not suppress errors, automate the human preview, or keep
  increasing delay if loss recurs at 10ms. Production search typing also has separate
  native packaged and deterministic fast-query evidence.
