id: desktop-native-input-delivery
title: Find whether fast synthetic typing loses keys before or inside the app
desc: N2 full desktop validation observed FILE_NOT_FOUND after native xdotool input
  at 1-2ms lost one character (fraudchek.ts or fraudcheck.s). Waiting for the exact
  palette-mode transition and using 10ms human-paced input keeps all assertions and
  is the limited test-harness mitigation. It is not established whether X11 delivery
  or controlled-input handling caused the loss. If this operational stress case matters,
  investigate with an instrumented disposable window created and controlled for the
  test. Do not suppress errors, automate the human preview, or keep increasing delay
  if loss recurs at 10ms. Production search typing also has separate evidence from
  native input in the packaged app and deterministic fast-query tests.
