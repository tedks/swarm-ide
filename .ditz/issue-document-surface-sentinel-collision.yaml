id: document-surface-sentinel-collision
title: Prevent the graph document identifier from colliding with a file named graphs
desc: During Q1 review, Google found that the existing activeSurface string can collide
  with a real repository file named graphs. Replace it with a typed identity through
  separate, narrowly scoped work on document navigation and persistence compatibility.
  Q1 adds no persistent migration and does not change graph/document lifetimes. Source
  inspection uses the actual open-tab identity, but the general identifier collision
  remains.
