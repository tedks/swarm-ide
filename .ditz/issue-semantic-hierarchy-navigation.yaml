id: semantic-hierarchy-navigation
title: Navigate directory, function, component, and service levels, not just graph
  zoom
desc: Directory descent is the first level. Later, real function/component/service
  views should change the level of information while keeping focus and supporting
  evidence coordinated. State provider coverage explicitly. Keep the domain graphs
  separate instead of using one node model for everything.
