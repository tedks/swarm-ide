id: swarm-idle-workspace-contexts
title: Suspend idle worktree observers while preserving buffers and accepted operations
desc: PR128 opens immutable provider contexts per selected canonical worktree and
  closes them at core shutdown. Visited contexts remain resident so accepted writes/builds
  and watchers keep their root. Measure larger fleets, then suspend or evict idle
  read observers without discarding dirty renderer buffers, active builds or owned
  process cleanup. No demonstrated resource incident in the bounded two-worktree proof.
