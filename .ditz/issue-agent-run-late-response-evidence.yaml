id: agent-run-late-response-evidence
title: Keep late agent acknowledgements so uncertain requests can be understood
desc: R0 review follow-up for runtime R2. Late replies to requests already marked
  settled are discarded; explicit rejections from an older core generation become
  unknown outcomes. Design a size-limited, sanitized record of these late replies.
  Consider preserving a definite rejection only when the command and core-generation
  identities establish that it was never dispatched. Do not log raw user transcripts
  or replay writes. R0 does not yet run agents, so its existing behavior deliberately
  favors an unknown result over an incorrect rejection.
