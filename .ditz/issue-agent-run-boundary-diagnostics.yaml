id: agent-run-boundary-diagnostics
title: Make agent connection errors clearer without exposing private text
desc: Nonblocking Anthropic R0 review follow-up for R1/W2. Preload read failures currently
  use the same conservative wording as writes and report INVALID_CORE_MESSAGE. Where
  safe, distinguish an unavailable connection from an invalid reply. Keep validation
  messages short and sanitized; never log raw requests, context, transcripts or secrets.
  Check whether provider errors, terminal summaries and cleanup messages should visibly
  escape Unicode direction and control characters. Do not rewrite the saved submitted
  context. Implement this in the later provider and UI modules, not by expanding the
  R0 runtime.
