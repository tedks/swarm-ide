id: agent-run-boundary-diagnostics
title: Refine agent boundary diagnostics and operator-facing text safety
desc: 'Non-blocking Anthropic convergence nits deferred from R0 to R1/W2: preload
  read failures currently share conservative mutation wording and INVALID_CORE_MESSAGE;
  distinguish unavailable transport from invalid response when safe. Preserve bounded
  sanitized validation diagnostics without logging raw request/context/transcript
  secrets. Evaluate visible escaping of Unicode bidi/control characters in provider
  error/terminal/cleanup summaries; do not rewrite immutable submitted context. Provider
  normalization and UI diagnostic polish belong to later owned modules, not another
  R0 runtime expansion.'
