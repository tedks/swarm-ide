id: editor-undo-history-20260907
title: Install editor undo history and verify native Undo/Redo
desc: 'The F2 disposable packaged-GUI test found that EditorPane.tsx installs defaultKeymap
  but no history()/historyKeymap extension. Native Ctrl-Z did not restore the synthetic
  source edit. This is a separate, existing editor capability gap; it neither blocks
  Fork nor represents a product behavior that F2 repaired. Limit the follow-up to
  undo/redo and history retention across tabs/navigation. F2 only corrected its cleanup
  driver to restore disposable text through ordinary input. Evidence: /tmp/swarm-ide-self-hosting.wkSErV/child-forks/gui-proof/run.lLdzNn/app.log.'
