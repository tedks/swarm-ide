id: scalable-working-world-observer
title: Replace working-world fingerprint polling with scalable filesystem hints
desc: The first real provider uses a globally ordered one-second Git fingerprint poll
  as the correctness fallback so unopened and newly added files revoke green truth.
  Replace the fallback with a scalable monorepo-capable observer (for example Watchman
  or Git fsmonitor integration) while retaining global generation ordering, bounded
  failure behavior, and periodic audit reconciliation.
