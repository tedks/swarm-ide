id: scalable-working-world-observer
title: Replace working-world fingerprint polling with scalable filesystem change detection
desc: The first real provider uses a globally ordered one-second Git fingerprint poll
  as the correctness fallback. This ensures changes to unopened files and newly added
  files invalidate the green state. Replace that fallback with a scalable observer
  that can handle monorepos, such as Watchman or Git fsmonitor integration. Keep global
  generation ordering, bounded failure behavior, and periodic audits that reconcile
  state.
