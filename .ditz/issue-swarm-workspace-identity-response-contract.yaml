id: swarm-workspace-identity-response-contract
title: Make metadata-only workspace identity responses explicit
desc: 'The project-sprite identityOnly workspace.open request deliberately returns
  the runtime-ready snapshot only to satisfy the existing CoreResponse envelope; its
  renderer consumer ignores that snapshot. Introduce an explicit metadata-only response
  shape or freshness marker before adding another consumer, so cached snapshot bytes
  cannot be mistaken for a fresh workspace observation. Follow-up from PR #152 council
  review.'
