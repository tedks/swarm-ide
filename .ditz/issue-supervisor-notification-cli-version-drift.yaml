id: supervisor-notification-cli-version-drift
title: Use a verified Codex executable for supervisor notifications
desc: 'On 2026-09-06, root reported that the stable-window recap watcher saved a recap
  matching its required marker but failed to wake root. The selected installed Codex
  0.146.0 rejected queue --thread, while the running root uses 0.153.4. Root has installed
  a replacement watcher for the new landing marker using the running root''s 0.153.4
  executable. Follow-up: make notification tooling select and record an explicit executable
  compatible with the destination session. Check queue support before reporting the
  watcher as operational. Distinguish successful recap capture from notification delivery,
  and show a useful failure message without discarding the recap or duplicating a
  wake. Test mismatched PATH/current-process versions, unsupported queue, correct
  executable selection, and delivery failure/retry. This is a report of observed behavior,
  not an independently verified diagnosis of every version. No tooling changes are
  authorized in the landing step. Root owns the current watcher; do not send a manual
  wake.'
type: bugfix
component: tooling
