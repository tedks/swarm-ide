id: supervisor-notification-cli-version-drift
title: Bind supervisor notifications to a verified Codex executable
desc: 'Root reported on2026-09-06 that the stable-window recap watcher saved its marker-qualified
  recap but failed to wake root: the selected installed Codex0.146.0 rejected queue
  --thread, while the running root uses0.153.4. Root has installed a replacement watcher
  for the new landing marker using the running root executable0.153.4. Follow-up:
  make notification tooling select and record an explicit executable compatible with
  the destination session; probe queue capability before declaring the watcher operational;
  distinguish recap capture success from notification delivery; surface an actionable
  failure without discarding the recap or duplicating a wake. Test mismatched PATH/current-process
  versions, unsupported queue, correct executable selection and delivery failure/retry.
  Treat this report as observed operational evidence, not an independently verified
  diagnosis of every version. No tooling changes authorized in the landing step; root
  owns the current watcher and no manual wake should be sent.'
