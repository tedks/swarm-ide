  comment: T1 reads hash-verified local Git objects with size preflight, bounded stdout/stderr
    and 5s command/10s observation deadlines. Git pack/delta decompression still lacks
    an OS memory ceiling, including hostile same-user object database races. Follow
    up before claiming a whole-host resource sandbox; T1 does not claim one. Production
    composition remains separate T3.
