id: adopt-stable-window-on-framework0
title: Deliberately adopt the stable-window supervisor on framework0
desc: 'PR #7 changes the launcher/main supervisor. The existing physical-desktop master
  process still runs the old restart-on-every-bundle implementation. Before fast-forwarding
  that watched checkout, obtain the deliberate adoption choice: stop/restart it, or
  explicitly pause its old launcher while preserving the current window. Do not silently
  recreate the physical-desktop window. Resume new supervisor on master port 55173
  after saving buffers; never disturb unrelated 5173.'
