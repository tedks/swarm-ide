  comment: 'User-driven follow-up from the live IDE: Enter/Shift-Enter and cursor
    stability; truthful lifecycle independent of Ditz recording; readable activity/jobs
    and Work Log; repaired actual plan manifest with plan-first coordinated 2x2 navigation;
    automatic bounded build context; wider conversation and fewer empty/jargon controls;
    installable Linux CLI/Nix and an honest Mac-friendly container path. Eight isolated
    owners, one App/layout integrator, local native focused checks, no public publication.
    Packaging does not hold individual UI landings.'
