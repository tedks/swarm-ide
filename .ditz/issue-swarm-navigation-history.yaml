  comment: 'CTO accepted the bounded proposal: deliberate file/component/task/agent/worktree
    visit history, Alt-Left/Right and native mouse side buttons; Alt-Up remains directory
    parent. Preserve unsaved work and replay navigation only. Schedule a separate
    implementation PR after current PR119 Activity refresh and PR120 unified header
    land to avoid overlapping App ownership. Normal observation refresh must not invalidate
    still-valid visits. No implementation started by this decision.'
