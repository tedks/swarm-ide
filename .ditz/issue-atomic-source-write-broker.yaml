id: atomic-source-write-broker
title: Provide cooperative or native compare-and-swap source writes
desc: The typed core currently performs bounded optimistic revision checks immediately
  before crash-safe atomic rename, and the renderer preserves observed concurrent
  conflicts. POSIX/Node exposes no conditional pathname replace, so an uncooperative
  external writer can still race inside the final check-to-rename syscall boundary.
  Design either a cooperative agent/editor write broker or a small audited native
  transaction helper that preserves crash safety and never loses the external version;
  add adversarial process-level tests.
