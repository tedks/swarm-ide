id: atomic-source-write-broker
title: Prevent source writes from overwriting concurrent external edits
desc: 'The typed local core currently checks for source changes immediately before
  a crash-safe atomic rename, and the renderer preserves conflicts it detects. These
  optimistic checks cover a limited window: POSIX/Node provides no conditional pathname
  replace, so an external writer that does not cooperate can still race between the
  final check and the rename syscall. Design either a cooperative agent/editor write
  broker or a small audited native transaction helper that preserves crash safety
  and never loses the external version. Add adversarial process-level tests.'
