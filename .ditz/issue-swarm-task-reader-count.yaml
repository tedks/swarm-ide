id: swarm-task-reader-count
title: Load task lists beyond the old 256-issue prototype cap
desc: The real Swarm repository now has 263 Ditz issues totaling about 494 KB. TASK_LIMITS.issues=256
  rejects the entire task observation despite small data. Remove this arbitrary count
  rejection consistently through the reader/parser/schema while retaining byte, timeout
  and metadata integrity controls. Prove >256 issues, actual repo read, retained task
  selections and automatic ref refresh; no pagination platform or unrelated UI redesign.
