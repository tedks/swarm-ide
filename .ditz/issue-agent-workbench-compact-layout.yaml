id: agent-workbench-compact-layout
title: Fit the run dock in small windows and share display limits with the runtime
desc: Follow up on W1 review notes. Check a compact Linux window with the dock at
  maximum size and the interface zoomed in. The current grid keeps a minimum graph
  size, so the outer page can scroll. Improve the responsive fit in W2 without remounting
  graphs. Coordinate exported model, effort and summary display limits with Runtime.
  W1's local limits are conservative, and full LaunchContext validation prevents mismatches
  from throwing. W1 does not authorize shared-schema changes.
