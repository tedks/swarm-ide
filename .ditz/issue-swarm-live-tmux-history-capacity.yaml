id: swarm-live-tmux-history-capacity
title: Design archival for full live-discovery registry generations
desc: Continuous tmux discovery intentionally preserves the existing 64-session and
  65,536-byte registry bounds. Design and implement an archival or generation-rotation
  policy so a long-running association can admit new supported owners after retained
  history reaches either bound, without losing readable history, transferring stale
  authority, or silently mixing socket/session scope.
