id: agent-run-post-admission-error-classification
title: Check whether failures after saving a launch are incorrectly reported as rejected
desc: 'Anthropic''s W2B review identified a case outside that change: after store.admit,
  service.ts can return a store.read error, while bridge-client maps ordinary storage
  errors to rejected instead of delivery-unknown. The default file-store.read uses
  already admitted in-memory entries, so reproduce the triggering conditions with
  targeted fault injection before calling it a live bug. Check that failure after
  persistence, or uncertain durability, cannot imply that no run was admitted or allow
  an unsafe retry. The real-policy profile remains unavailable. Runtime/integration
  owns this follow-up before an authenticated end-to-end test.'
