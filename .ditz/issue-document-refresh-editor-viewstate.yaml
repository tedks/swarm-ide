id: document-refresh-editor-viewstate
title: Preserve editor and graph view state across document refresh
desc: The stable-window change preserves buffers and pending writes through HMR, and
  paths, focus, lens, interface zoom and stale topology over safe document refresh.
  Editor cursor/scroll/undo history and per-graph pan/zoom are not yet checkpointed
  across a required preload/document refresh. Add bounded view-state snapshots when
  useful; preserve the existing dirty and in-flight-write guards.
