id: document-refresh-editor-viewstate
title: Preserve editor and graph view state across document refresh
desc: The stable-window change preserves buffers and pending writes during HMR. On
  a safe document refresh, it preserves paths, focus, lens, interface zoom, and stale
  topology. Editor cursor position, scroll position, undo history, and each graph's
  pan/zoom are not yet saved across a required preload/document refresh. Add view-state
  snapshots with explicit limits when useful, while keeping the existing guards for
  unsaved edits and writes in progress.
