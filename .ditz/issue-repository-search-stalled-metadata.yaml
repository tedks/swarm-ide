id: repository-search-stalled-metadata
title: Consider isolating stalled filesystem metadata calls beyond search-response
  limits
desc: N2 limits search responses and allows at most one active metadata lookup chain.
  A timeout, superseding request, or disposal cannot start follow-on lookups. Node
  cannot cancel a kernel lstat/realpath call that is already stalled on a mount. The
  call remains with the local-core process until the OS returns or the core exits.
  Consider a separate disposable metadata helper with clear lifecycle ownership only
  if this operational need arises. Do not claim N2 cancels kernel calls or expand
  renderer permissions. Existing deadline/disposal/nonaccumulation tests cover these
  limits.
