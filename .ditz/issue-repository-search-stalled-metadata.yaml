id: repository-search-stalled-metadata
title: Isolate stalled filesystem metadata beyond bounded search responses
desc: N2 bounds search responses and permits at most one actual metadata chain; timeout/supersession/disposal
  cannot start follow-on lookups. Node cannot cancel a kernel lstat/realpath already
  stalled on a mount. It remains owned by the local-core process until the OS returns
  or the core exits. Consider a separately owned disposable metadata helper only if
  this operational need arises; do not claim N2 cancels kernel calls or broaden renderer
  authority. Current deadline/disposal/nonaccumulation tests cover the bounded behavior.
