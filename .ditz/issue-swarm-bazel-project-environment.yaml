id: swarm-bazel-project-environment
title: Use the project development environment for IDE build and test jobs
desc: 'Actual Context-pane session-registration and living-design runs fail before
  assertions: pnpm not found. Installed executor inherits app tools instead of selected
  project Nix environment; demo checkout also lacks materialized dependencies. Make
  shared exact-target jobs use project dev environment, retain owned cancellation,
  and provide clear setup errors without implicit installs or lock changes.'
type: bugfix
