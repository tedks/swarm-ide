id: swarm-collapse-older-forks
title: Collapse older agent forks in the sidebar
desc: Make the live agent hierarchy easier to scan by collapsing older fork branches/groups
  while retaining newest-first ordering, selected-agent ancestry, manual disclosure
  and deep connectors. Prefer historical/noninteractive older sessions for default
  collapse, but do not equate silence, disconnection or read-only access with completed
  work. No activity-stream or message-authority changes.
