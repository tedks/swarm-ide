  comment: R2 deliberately uses one atomic validated snapshot per durable update/append.
    Hard store64MiB and transcript8MiB bounds hold, but O(retained-history) serialization/write
    amplification should be measured and batched or journaled before high-throughput/multi-run
    support. No throughput claim from first read-only slice.
