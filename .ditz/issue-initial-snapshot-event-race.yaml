id: initial-snapshot-event-race
title: Prevent a delayed initial snapshot from replacing a newer event
desc: 'Guard the renderer bootstrap so a delayed workspace.snapshot response cannot
  overwrite a newer core event that arrived after subscription. Merge the response
  through a functional state update keyed by its sequence watermark and add a deferred-response
  regression test. Deferred from PR #1 by CTO decision after convergence review.'
