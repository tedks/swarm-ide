id: swarm-live-tmux-discovery
title: Notice new tmux agents while the IDE is open
desc: 'Goals user run exposed that launcher tmux association is one-shot: a real new
  CLI fork appeared in personal goals after IDE launch but not in its one-row registry.
  Existing hierarchy can render its real fork parent once registered. Reconcile newly
  created agents within the already selected/authorized tmux session while the IDE
  is open, preserving existing registrations, exact process/rollout/worktree validation
  and unrelated-project scope. No implicit launch, send, resume or ownership takeover.
  PR148 fixes bare-parent startup only, not this live-discovery gap.'
type: bugfix
