  what: commented
  comment: 'User wants the repo as home: master landed changes; worktrees with branch,
    agents, PR state and uncommitted changes; switch linked agent/worktree context
    and inspect branch-versus-master or working edits while preserving each view.
    Existing worktree inspection is not yet a coherent repository-wide overview. Awaiting
    a bounded owner; not claimed delivered.'
- time: 2026-09-08T13:50:06-00:00
  who: Ted Smith
  what: commented
  comment: 'User clarifies first-class worktree navigation: directory pane owns a
    worktree selector; agent Worktree action switches the ordinary repo browser, graph
    and contextual instruments into that worktree. No second-class agent-only browser.
    Worktree-global Context shows branch, owner agent(s), PR and basic master/uncommitted
    diff information. Preserve per-worktree editor/graph state, and switching inspected
    worktree must not implicitly change the message recipient. This replaces the separate
    workflow, not adds another browser; avoid collision with active App/layout owner.'
