  comment: Implemented named registered-agent conversation tabs in PR115. Live working/waiting
    sessions appear without stealing focus; Ctrl-Tab and Shift-Ctrl-Tab switch inside
    the agent pane. Closing hides a view, never stops a worker. Existing sender, independent
    drafts, queued text and per-session reading positions are preserved. Reconnect
    keeps dismissed/history tabs and an enabled keyboard escape. Seventy focused tests
    plus both typechecks and the desktop package pass; native review converged clean.
    Ready for ROOT ordered landing above PR107; no real message or managed app change.
