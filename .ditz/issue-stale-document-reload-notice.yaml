id: stale-document-reload-notice
title: Clear the stale reload-blocked notice after a successful manual refresh
desc: 'The W2B screenshot from its test-owned virtual desktop shows that manual CtrlR
  reload succeeds in the same window after explicitly discarding agent intent. The
  document''s timeOrigin changes and source is restored, but the shell lifecycle notice
  still says Document reload deferred: save or reconcile buffers first. In main.ts,
  will-prevent-unload sets a source-only notice and did-finish-load retains it. Runtime
  needs to fix the lifecycle wording and reset. The renderer''s agent guard correctly
  describes the intent while the current document is retained. Leave shared lifecycle
  edits out of W2B.'
type: bugfix
component: default
