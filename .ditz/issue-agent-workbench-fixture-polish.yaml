id: agent-workbench-fixture-polish
title: Clarify fixture errors and simplify playback bookkeeping
desc: Nonblocking W1 review follow-ups for W2. Distinguish schema-validation failures
  from unexpected development-only errors without exposing raw context. Derive escaped-text
  test sizes from shared limits and assert the raw limits. Replace stream-marker prefix
  matching with an explicit local marker; optionally normalize trailing whitespace
  in display labels. Ctrl+Enter intentionally applies only inside the form, including
  focused buttons, and is documented rather than globally bound. RunSummary allows
  newlines, tabs and trailing whitespace, so multiline tasks do not fail parsing.
  Full candidate validation and regression tests already exist; these are maintenance
  improvements, not permission to expand the runtime.
