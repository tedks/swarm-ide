id: scoped-workbench-configuration
title: Combine repository, folder, and user workbench settings and show their sources
desc: After real contextual instruments are available, let users pin/resize widgets
  and add together repo/folder/user defaults. The deepest default wins, with a standard
  alternative available. Show clickable links to each setting's source. Ask before
  accepting conflicting shortcuts, and let the user back out. Do not introduce an
  HR data model.
