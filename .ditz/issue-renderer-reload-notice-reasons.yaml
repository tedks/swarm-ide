id: renderer-reload-notice-reasons
title: Use typed renderer reload notice reasons rather than matching copy
desc: The W2B council noted that the inherited reloadNotice in App.tsx is a string,
  and agent-resolution cleanup matches a controlled phrase. Existing safety checks
  still read live state directly, so wording changes can leave a stale message but
  cannot bypass safety. When centralizing notices, add typed source/agent/storage/reload
  reasons. This follow-up was deliberately excluded from W2B's limited source-persistence/lifecycle
  work.
