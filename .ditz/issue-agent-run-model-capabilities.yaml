id: agent-run-model-capabilities
title: Check each model's reasoning options before offering them in the UI
desc: R1 rejects a non-null effort with UNSUPPORTED_CONTROL because AdapterCapabilities
  does not yet describe model-specific reasoning support. In R2 or later, query the
  installed provider's model capabilities, keep requested settings distinct from actual
  settings, and reject unsupported effort values instead of silently falling back.
  Do not infer supported values from the CLI version.
