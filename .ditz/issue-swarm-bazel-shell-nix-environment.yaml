id: swarm-bazel-shell-nix-environment
title: Support shell.nix for selected-target project environments
desc: Extend selected-target development-environment selection to legacy shell.nix
  workspaces after defining deterministic shell selection and lock/update semantics.
  The completed runner deliberately supports regular flake.nix only and preserves
  direct pinned-Bazel fallback otherwise. While extending the proof, make the post-Bazel-marker
  regression independently assert flake selection; current sibling tests already cover
  that prerequisite.
