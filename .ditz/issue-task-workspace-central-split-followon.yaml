id: task-workspace-central-split-followon
title: Add a split view for the central task document and focused task graph
desc: The user's future ideal is an upper central pane for task details, metadata
  and timing, with a graph of the task's location in the lower half. T4 deliberately
  keeps the existing independent graph and central task document. Add a configurable
  split without losing source edits, draft text or graph camera positions. This is
  not required for the demo.
