id: swarm-target-build-persistence
title: Persist target build history and cache across core restarts
desc: Selected-target builds now retain 20 jobs and a private Bazel cache for the
  current core lifetime. Extend persistence with explicit root identity, stale-running
  reconciliation and cache cleanup policy; never replay builds during recovery. Followup
  to swarm-target-build-jobs / PR124.
