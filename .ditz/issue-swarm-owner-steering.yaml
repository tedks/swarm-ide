id: swarm-owner-steering
title: Steer sessions through their current owner and open their actual terminals
desc: 'F7: After the read-only work, reuse codex queue for normal terminal-owned sessions.
  Leave unsupported controls read-only. Generate exact attach/switch commands from
  the live tmux identity, improving the current handoff that only selects a session.
  Native children remain IDE-owned and terminal children remain tmux-owned; never
  start a second execution owner for a session. Coordinate with C7 on the cockpit.
  See docs/swarm-operator-hour.md.'
