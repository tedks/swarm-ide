id: cockpit-touch-target-size
title: Consider larger touch targets in a later touch-oriented cockpit view
desc: In W3 review, Google noted that compact panel controls are sized for Linux desktop
  keyboard/pointer use and fall below the mobile 44px guidance. The desktop-first
  compact layout was retained intentionally. Assess touch-target sizes when touch
  UI becomes a supported context.
