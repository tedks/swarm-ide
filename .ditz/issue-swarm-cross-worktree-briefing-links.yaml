id: swarm-cross-worktree-briefing-links
title: Open registered briefing links across worktrees
desc: C7's first packaged-app test could not open registered contextPaths from another
  worktree. core/external-agents.ts still clears contextPaths when session.contextRoot
  differs from the opened repository. Activity events now open the correct registered
  worktree through worktree.inspect, and that route passed the GUI test, but the briefing
  links are still hidden. Show those briefing paths with their session identity and
  open them through the existing read-only inspector. Do not resolve the paths against
  the currently opened repository.
