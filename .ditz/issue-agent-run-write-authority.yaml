id: agent-run-write-authority
title: Define permissions for agents that write to a worktree
desc: Deferred until after the first read-only end-to-end workflow. Before enabling
  implementation agents, define a user-approved write policy for registered worktrees,
  including the allowed scope, approvals, isolation, edit observation and recovery.
  Read-only model analysis does not establish permission to write.
