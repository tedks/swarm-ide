id: dynamic-build-graph-followup
title: Let users select build targets and expand build-graph coverage
desc: 'B1 intentionally limits observation to local Bazel7 declarations: 80 targets
  displayed, a data cap of 2000 targets/8000 edges, unconfigured query, unresolved
  external deps, and no symlinked definitions. Google review noted that showing all
  targets by default can be noisy at scale. Future saved/focused target selection
  should reduce this without hiding isolated rules. Ignored/external/environment changes
  require an explicit refresh. Expanding coverage and supporting Bazel configurations
  needs a separate, narrowly scoped change; do not label partial coverage as complete.'
type: feature
component: default
