id: agent-owned-process-observer-discrepancy
title: Investigate why a process was briefly listed after cleanup was confirmed
desc: On N2 topic 8355521, the unchanged process-ownership code passed 1193 of 1194
  quality tests. tests/agent-owned-process.test.ts:152 failed because liveMembers(namespace)
  reported PID 3335140 immediately after cleanup was confirmed. afterEach did not
  time out, and a later read-only check found no such PID. The failure is saved in
  N2's verified-tests.log and stable artifacts. liveMembers compares a reusable PID-namespace
  inode and reads stat separately, without holding the namespace or process-start
  identity. Namespace/PID reuse is a possible explanation, not an established cause.
  Cleanup already waits for the namespace wrapper and guardian to close, so terminal-witness
  timing alone does not explain the failure. Request a separate diagnostic step that
  records the inode, PID start time, state and command, and checks those identities
  repeatedly. Keep the assertion unchanged and leave the issue open until explained.
  N2's search changes did not alter the process lifecycle; the real-policy profile
  remains unavailable.
