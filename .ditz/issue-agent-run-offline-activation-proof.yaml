id: agent-run-offline-activation-proof
title: Test the remaining ways hooks, plugins and related features can start offline
desc: P2 PR17 supplies an offline namespace with immutable policy inputs and demonstrates
  configuration/feature counterexamples without model calls. It does not establish
  the effective profile. Next, use safe positive controls and triggers that need no
  model call to test ordinary hooks and trust bypass; bundled and executor plugin
  hooks; executor/plugin MCP; saved remote-control and plugin state; and telemetry
  state. Reuse the same immutable boundary, package-identity checks and process-cleanup
  tests. Do not enable the production capability or claim equivalent behavior for
  an authenticated process without a separate ROOT decision.
