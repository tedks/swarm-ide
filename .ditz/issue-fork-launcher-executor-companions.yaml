id: fork-launcher-executor-companions
title: Package Codex fork launcher companion executables with pinned CLI
desc: 'The first-agent-run design fork failed before it could run commands: pinned
  codex-0.153.4 could not find its sibling codex-code-mode-host. Root restored a byte-identical
  companion from the running matching package, and actual command execution then passed.
  In the launcher/dotfiles workflow, copy or locate the complete versioned executable
  bundle and smoke-test command execution, not just CLI startup. Do not change global
  tooling during this design step.'
