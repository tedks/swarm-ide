id: swarm-plan-incremental-index
title: Read larger living designs incrementally
desc: The usability repair removes per-component source/document count limits and
  expands long lists on demand. The overall v1 plan index still has a 64 KiB byte
  ceiling and 128-node bound. Follow up with bounded incremental loading/expansion
  for larger design forests, preserving authored relationships, explicit coverage
  and shared selection rather than merely increasing another count limit. This is
  not required for the current seven-component Swarm plan.
